name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write # OIDC: assume the deploy role, no stored AWS keys
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Inert until the Terraform module has actually been applied and the two
    # repo variables are set from its outputs. Without this the job fails on
    # every push, because there is no role to assume and no instance to target.
    # Setting the variables activates it — no workflow change needed.
    if: vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != ''
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1

      # The instance pulls and builds; CI only triggers it and reports the
      # result. The role's only permission is SendCommand against this box.
      - name: Run deploy on the instance
        run: |
          set -euo pipefail

          POLL_INTERVAL_SECONDS=15
          POLL_TIMEOUT_MINUTES=45
          POLL_ATTEMPTS=$(( POLL_TIMEOUT_MINUTES * 60 / POLL_INTERVAL_SECONDS ))

          command_id=$(aws ssm send-command \
            --document-name AWS-RunShellScript \
            --targets "Key=instanceids,Values=${{ vars.AWS_INSTANCE_ID }}" \
            --comment "deploy ${GITHUB_SHA::7}" \
            --timeout-seconds 900 \
            --parameters 'commands=["sudo -u ec2-user -H /usr/local/bin/portfolio-api-deploy"]' \
            --query Command.CommandId --output text)

          echo "SSM command: $command_id"

          # Poll rather than `aws ssm wait command-executed`: the waiter gives up
          # after ~100s, but npm ci plus a webpack build on a t4g.nano runs well
          # past that, and a still-running deploy would be reported as a failure.
          #
          # The box is not consistent: a warm deploy finishes in ~5 minutes, but a
          # cold one has been measured at 26m21s, most likely burning through the
          # t4g.nano's CPU credits during the build. The ceiling is therefore set
          # well clear of that, because giving up early is worse than waiting --
          # it reports a deploy that went on to succeed as a failure, which is
          # what sent the 2026-09-12 run red while the instance finished fine.
          status=Pending
          for _ in $(seq 1 $POLL_ATTEMPTS); do
            status=$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --query Status --output text)
            case "$status" in
              Success|Failed|Cancelled|TimedOut) break ;;
            esac
            sleep "$POLL_INTERVAL_SECONDS"
          done

          aws ssm get-command-invocation \
            --command-id "$command_id" \
            --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
            --query StandardOutputContent --output text | tail -30

          # A deploy still running when the poll window closes has not failed, and
          # must not be described as though it had: the instance may well go on to
          # finish. Say what actually happened, and where to look for the outcome.
          case "$status" in
            Pending|InProgress|Delayed)
              echo "::error::Gave up waiting after ${POLL_TIMEOUT_MINUTES} minutes; the deploy is still $status and may yet succeed on the instance. Check it with: aws ssm get-command-invocation --command-id $command_id --instance-id ${{ vars.AWS_INSTANCE_ID }}"
              exit 1
              ;;
          esac

          if [ "$status" != "Success" ]; then
            echo "::error::deploy finished with status $status"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "${{ vars.AWS_INSTANCE_ID }}" \
              --query StandardErrorContent --output text | tail -40
            exit 1
          fi
